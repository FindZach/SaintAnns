version: "3.9"

services:
  app:
    build: .
    image: olv-parish:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GIN_MODE: debug
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: olv_parish
      DB_PASSWORD: olv_parish_dev
      DB_NAME: olv_parish
      DB_SSLMODE: disable
      FRONTEND_URL: http://localhost:8080
      # Dev-only placeholder secrets, 32+ chars so config.Validate accepts them.
      # Rotate before deploying anywhere real.
      JWT_SECRET: dev-only-jwt-secret-at-least-32-chars-long
      SESSION_SECRET: dev-only-session-secret-at-least-32-chars-long
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    working_dir: /app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olv_parish
      POSTGRES_PASSWORD: olv_parish_dev
      POSTGRES_DB: olv_parish
    volumes:
      - olv_parish_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olv_parish -d olv_parish"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  olv_parish_data:
